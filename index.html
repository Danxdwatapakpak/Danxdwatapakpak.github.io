<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>

  <h1 id="question">Will you go out with me? ❤️</h1>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <!-- Jumpscare Overlay -->
  <div id="jumpscare" class="hidden">
    <!-- Replace with any scary image URL you want -->
    <img src="https://unsplash.com" alt="BOO!">
    <!-- Replace with a loud sound file URL -->
    <audio id="screamSound" src="https://google.com" preload="auto"></audio>
  </div>

  <script src="js.js"></script>
</body>
</html>
